[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora com Google ADK"
authors = [
    { name = "Pedro Ferreira", email = "idpedroferreira@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "google-adk==2.13.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aurora-api = "residencial_aurora.api:main"
aurora-restaurar = "residencial_aurora.restaurar:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
